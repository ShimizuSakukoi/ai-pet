<!DOCTYPE html>
<html lang="zh-CN">
<!--
  宠物窗口 — Live2D 模型独立窗口
  ============================================================
  职责：显示 Live2D 动态角色 + 心情标签
  互动：双击抚摸、右键打开聊天窗口
  窗口拖拽：easy_drag=True，任意位置可拖
-->
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Pet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: transparent;
            width: 100vw; height: 100vh;
            overflow: hidden;
            user-select: none;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }
        .pet-container {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        #live2d-canvas { width: 100%; height: 100%; }
        .fallback-pet {
            font-size: 100px;
            animation: float 3s ease-in-out infinite;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
    </style>
</head>
<body>
    <div class="pet-container">
        <canvas id="live2d-canvas"></canvas>
    </div>

    <script src="js/lib/pixi.min.js"></script>
    <script src="js/lib/live2dcubismcore.min.js"></script>
    <script src="js/lib/pixi-live2d.cubism4.min.js"></script>
    <script src="js/lib/L2Dwidget.min.js"></script>
    <script src="js/bridge.js"></script>
    <script src="js/common.js"></script>
    <script src="js/live2d.js"></script>
    <script src="js/pet-ui.js"></script>
</body>
</html>
