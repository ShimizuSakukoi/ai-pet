<!DOCTYPE html>
<html lang="zh-CN">
<!--
  聊天窗口 — 对话 & 设置独立窗口
  ============================================================
  职责：LLM 对话、设置面板、记忆管理、状态栏
  通信：通过 bridge.js → pywebview.api → handler.py → PetBrain
  回复内容由本窗口直接显示；双击宠物时回复由 handler 推送过来
-->
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Pet Chat</title>
    <link rel="stylesheet" href="css/pet.css" />
</head>
<body class="pet-mode" style="-webkit-app-region: no-drag">

    <!-- ====== 聊天区 ====== -->
    <div class="chat-window" id="chat-window">
        <!-- 标题栏（拖拽把手 / 窗口拖拽区域） -->
        <div class="chat-header" id="chat-header">
            <span>💬 聊天 · 记忆: <span id="mem-count">0</span></span>
            <div class="chat-header-btns">
                <button id="btn-chat-close" title="隐藏窗口">_</button>
            </div>
        </div>

        <!-- 功能按钮栏 -->
        <div class="chat-toolbar">
            <button id="btn-new-chat" title="新对话">💬 新对话</button>
            <span class="tb-sep"></span>
            <button id="btn-settings" title="设置">⚙ 设置</button>
            <button id="btn-memories" title="记忆管理">📋 记忆</button>
            <button id="btn-reset" title="清除所有记忆">🗑 清除</button>
            <span class="tb-sep"></span>
            <button id="btn-model-prev">◀</button>
            <button id="btn-model-name" class="model-name-btn">dafeng</button>
            <button id="btn-model-next">▶</button>
            <span class="tb-spacer"></span>
            <button id="btn-minimize" title="最小化">_</button>
            <button id="btn-quit" title="退出">✕</button>
        </div>

        <!-- 聊天记录 -->
        <div class="chat-area" id="chat-area">
            <div class="message system">⚡ 点击 ⚙ 设置 配置 API Key</div>
        </div>

        <!-- 快捷回复 -->
        <div class="quick-replies" id="quick-replies">
            <button id="btn-refresh-replies" title="换一批">🔄</button>
        </div>

        <!-- 输入区 -->
        <div class="input-area">
            <button id="btn-voice" title="语音输入" class="voice-btn">🎤</button>
            <button id="btn-mute" title="静音" class="mute-btn">🔊</button>
            <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="100" title="音量" />
            <input type="text" id="chat-input" placeholder="说点什么..." />
            <button class="send-btn" id="send-btn">发送</button>
        </div>

        </div>

        <!-- 记忆管理面板 -->
    <div class="mem-overlay" id="mem-overlay" style="display:none;">
        <div class="mem-panel">
            <div class="mem-header">
                <h3>🧠 记忆管理</h3>
                <button id="mem-btn-close" class="mem-close">✕</button>
            </div>
            <div class="mem-list" id="mem-list"></div>
            <div class="mem-edit-area hidden" id="mem-edit-area">
                <textarea id="mem-edit-input" maxlength="200" placeholder="修改记忆内容..."></textarea>
                <div class="mem-edit-actions">
                    <button id="mem-btn-save" class="btn-mem-save">保存</button>
                    <button id="mem-btn-cancel" class="btn-mem-cancel">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 设置面板 -->
    <div class="setup-overlay" id="setup-overlay" style="display:none">
        <div class="setup-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; -webkit-app-region: drag;">
                <h2 style="margin: 0;">🐱 AI Pet 设置</h2>
                <button id="setup-btn-close" title="关闭"
                        class="setup-close-btn">✕</button>
            </div>
            <p class="subtitle" id="setup-subtitle">首次使用，请配置 LLM 连接</p>
            <div id="setup-step-llm">
                <label>API 提供商</label>
                <select id="setup-provider">
                    <option value="deepseek">DeepSeek</option>
                    <option value="openai">OpenAI</option>
                    <option value="custom">自定义</option>
                </select>
                <label>API Key</label>
                <div class="key-input-row">
                    <input type="password" id="setup-apikey" placeholder="sk-..." />
                    <button type="button" class="toggle-key-btn" id="btn-toggle-key">👁</button>
                </div>
                <div id="setup-url-group" class="hidden">
                    <label>API 地址</label>
                    <input type="text" id="setup-baseurl" placeholder="https://api.openai.com/v1" />
                </div>
                <label>模型</label>
                <select id="setup-model"></select>
                <button id="setup-btn-test" class="btn-secondary">🔌 测试连接</button>
                <div class="test-result" id="setup-test-result"></div>
                <div class="setup-divider"></div>
                <button id="setup-btn-update" class="btn-secondary">🔍 检查更新</button>
                <div class="test-result" id="setup-update-result"></div>
                <div class="setup-divider"></div>
                <label class="checkbox-label">
                    <input type="checkbox" id="setup-ontop" /> 窗口置顶
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="setup-autostart" /> 开机自启
                </label>
                <label>主题</label>
                <select id="setup-theme">
                    <option value="dark">深色</option>
                    <option value="light">浅色</option>
                    <option value="system">跟随系统</option>
                </select>
                <button id="setup-btn-save" disabled>💾 保存并开始</button>
                <div class="error-msg" id="setup-error"></div>
            </div>
        </div>
    </div>

    <!-- 变体选择菜单 -->
    <div id="variant-menu" class="variant-menu" style="display:none;"></div>

    <script src="js/bridge.js"></script>
    <script src="js/common.js"></script>
    <script src="js/message.js"></script>
    <script src="js/idle.js"></script>
    <script src="js/voice.js"></script>
    <script src="js/notify.js"></script>
    <script src="js/memory-panel.js"></script>
    <script src="js/setup-ui.js"></script>
    <script src="js/chat.js"></script>
</body>
</html>
